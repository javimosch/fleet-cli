name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.fleetVersion=${GITHUB_REF_NAME#v}" -o "dist/fleet-${GOOS}-${GOARCH}" ./cmd/fleet
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/fleet-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fleet-*
          merge-multiple: true
      - name: Checksums and update manifests
        run: |
          sha256sum dist/fleet-* > dist/SHA256SUMS
          for binary in dist/fleet-*; do
            name="${binary##*/}"
            hash="$(sha256sum "$binary" | awk '{print $1}')"
            platform="${name#fleet-}"
            printf '{"ok":true,"version":"%s","download":"%s","sha256":"%s"}\n' "${hash:0:12}" "$name" "$hash" > "dist/version-${platform}.json"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/fleet-* dist/SHA256SUMS dist/version-*.json --generate-notes --title "$GITHUB_REF_NAME"
